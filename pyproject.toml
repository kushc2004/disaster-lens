[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disasterlens"
version = "0.1.0"
description = "Multimodal disaster damage assessment research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "geopandas>=1.0",
  "networkx>=3.2",
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyogrio>=0.9",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "rasterio>=1.3",
  "matplotlib>=3.8",
  "scipy>=1.12",
  "shapely>=2.0",
  "streamlit>=1.38",
  "torch>=2.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/disasterlens"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
