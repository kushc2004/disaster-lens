[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disasterlens"
version = "0.1.0"
description = "Multimodal disaster damage assessment research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
  "torch>=2.3",
  "rasterio>=1.3",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/disasterlens"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

